tools:
  - name: session_info
    description: Report the REAPER host version, active transport, and adapter identity.
    execution: sync
    affinity: any
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    script: scripts/session_info.py

  - name: list_projects
    description: List the project tabs currently open in this REAPER instance.
    execution: sync
    affinity: any
    parameters:
      type: object
      properties: {}
      additionalProperties: false
    script: scripts/list_projects.py
