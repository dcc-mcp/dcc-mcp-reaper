tools:
  - name: list_tracks
    description: List every track in the active project with name, mute/solo state and FX count.
    read_only: true
    output_schema: {type: object}
    execution: sync
    affinity: any
    input_schema:
      type: object
      properties:
        limit:
          type: integer
          description: Maximum number of tracks to return. Defaults to all tracks.
          minimum: 1
      additionalProperties: false
    source_file: scripts/list_tracks.py
