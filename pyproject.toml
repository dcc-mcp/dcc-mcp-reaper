[build-system]
requires = ["hatchling>=1.17"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-reaper"
version = "0.1.2" # x-release-please-version
description = "REAPER DAW session, project, transport and track inspection for DCC-MCP agents"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [{name = "loonghao", email = "hal.long@outlook.com"}]
keywords = ["reaper", "daw", "audio", "dcc", "mcp", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = ["dcc-mcp-core>=0.20.40,<1.0.0"]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-reaper"
Repository = "https://github.com/dcc-mcp/dcc-mcp-reaper"
Issues = "https://github.com/dcc-mcp/dcc-mcp-reaper/issues"

[project.optional-dependencies]
external = ["reapy-boost>=0.10; python_version>='3.7'"]
test = [
  "pytest>=7.4,<8; python_version<'3.8'",
  "pytest>=8; python_version>='3.8'",
  "PyYAML>=6",
]
dev = [
  "pytest>=7.4,<8; python_version<'3.8'",
  "pytest>=8; python_version>='3.8'",
  "PyYAML>=6",
  "ruff>=0.8",
  "build>=1.2",
  "twine>=6",
]

[project.scripts]
dcc-mcp-reaper = "dcc_mcp_reaper.cli:main"

[project.entry-points."dcc_mcp.adapters"]
reaper = "dcc_mcp_reaper:ReaperServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_reaper"]
artifacts = ["src/dcc_mcp_reaper/skills/**"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/**/*.png", "docs/**/*.svg", "docs/**/*.webp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["reaper: requires a running REAPER host"]

[tool.ruff]
line-length = 120
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
